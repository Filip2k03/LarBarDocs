<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LaBar Passenger Application v2</title>
  <style>
    :root{--ink:#111827;--muted:#64748b;--line:#e2e8f0;--base:#f6f7fb;--paper:#fff;--red:#e5252a;--gold:#e9a20b;--gold-dark:#a65d04;--blue:#2563eb;--green:#078766;--nav:#101522}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff7dc,transparent 35%),var(--base);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1280px;margin:auto;padding:26px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.intro h1{font-size:30px;letter-spacing:-.04em;margin:0}.intro p{margin:6px 0 0;color:var(--muted)}select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-weight:750;color:var(--ink)}.stagebar{display:flex;gap:8px;overflow:auto;padding:2px 1px 16px}.stagebar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;color:#475569;font-weight:750}.stagebar button.active{background:var(--nav);color:#fff;border-color:var(--nav)}.phone{width:390px;height:844px;margin:auto;border:8px solid var(--nav);border-radius:46px;background:#fff;overflow:hidden;position:relative;box-shadow:0 34px 80px #11182726}.island{width:124px;height:27px;border-radius:0 0 16px 16px;background:var(--nav);margin:auto}.topbar{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}.topbar img,.icon{width:25px;height:25px;color:var(--gold-dark)}.brand{font-weight:950;color:var(--gold-dark);font-size:18px}.screenname{margin-left:auto;font-size:11px;font-weight:850;color:#475569}.content{height:692px;overflow-y:auto;padding:18px 18px 96px;background:linear-gradient(#fff,#fbfcfe)}h2{font-size:24px;line-height:1.12;margin:2px 0 7px;letter-spacing:-.03em}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:900}.lead{color:var(--muted);margin:0 0 15px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px;margin:10px 0;box-shadow:0 5px 18px #11182708}.card.gold{background:#fffbeb;border-color:#fcd98d}.card.green{background:#ecfdf5;border-color:#a7f3d0}.card.dark{background:var(--nav);border-color:var(--nav);color:#fff}.row{display:flex;align-items:center;gap:11px}.row img{width:31px;height:31px}.grow{flex:1}.muted{color:var(--muted);font-size:11px}.metric{font-size:27px;font-weight:950;letter-spacing:-.04em}.btn{width:100%;border:0;border-radius:13px;padding:13px 14px;font-weight:900;background:linear-gradient(135deg,#f4b31f,#ce7605);color:#fff;margin-top:9px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:linear-gradient(135deg,#ef4444,#be123c)}.map{height:245px;border-radius:18px;position:relative;overflow:hidden;background:#e9f1ea;background-image:linear-gradient(35deg,transparent 47%,#fff 48%,#fff 52%,transparent 53%),linear-gradient(145deg,transparent 47%,#d6e3ea 48%,#d6e3ea 52%,transparent 53%);background-size:90px 90px;border:1px solid #d8e2e9}.map:before{content:"";position:absolute;left:66px;top:36px;width:225px;height:140px;border:6px solid var(--gold);border-color:var(--gold) transparent var(--gold) var(--gold);border-radius:45% 22% 44% 28%;transform:rotate(-7deg)}.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #fff}.pin.a{left:63px;top:163px;background:var(--green)}.pin.b{right:74px;top:47px}.fareline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.fareline:last-child{border:0}.fareline.total{font-weight:950;font-size:16px}.pills{display:flex;flex-wrap:wrap;gap:7px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.pill.active{border-color:var(--gold);background:#fff7d6;color:#8a4b00}.input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}.bottom{height:58px;position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.bottom button{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:800}.bottom img{display:block;width:22px;height:22px;margin:0 auto 3px}.bottom button.active{color:var(--gold-dark)}.receipt{border-top:2px dashed var(--line);margin-top:12px;padding-top:10px}.safety{display:none}.safety.open{display:block}.progress{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:68%}@media(max-width:600px){.shell{padding:0}.intro,.stagebar{display:none}.phone{width:100vw;height:100vh;border:0;border-radius:0}.content{height:calc(100vh - 149px)}}
  </style>
  <link rel="stylesheet" href="/prototypes/passenger-v2.css">
</head>
<body><main class="shell"><header class="intro"><div><h1>LaBar Passenger Application</h1><p>Complete booking, trip, receipt, account, credit, Guardian, and support lifecycle.</p></div><select id="picker" onchange="openScreen(this.value)"></select></header><nav class="stagebar" id="stagebar"></nav><section class="phone"><div class="island"></div><div class="topbar"><img src="/icons/labar-mark.svg" alt=""><span class="brand">LaBar</span><span class="screenname" id="screenname"></span></div><div class="content" id="content"></div><nav class="bottom"><button onclick="openScreen('home')"><img src="/icons/home.svg" alt="">Home</button><button onclick="openScreen('my-trips')"><img src="/icons/history.svg" alt="">Trips</button><button onclick="openScreen('wallet')"><img src="/icons/wallet.svg" alt="">Credit</button><button onclick="openScreen('profile')"><img src="/icons/profile.svg" alt="">Profile</button></nav></section></main>
<script>
const screens=[['splash','Splash','entry'],['home','Home','discover'],['pickup-map','Pickup / Map','plan'],['route-fees','Route & Fees','plan'],['choose-ride','Choose Ride','plan'],['payment','Payment','checkout'],['finding-driver','Finding Driver','dispatch'],['driver-on-the-way','Driver On The Way','pickup'],['driver-details','Driver Details','pickup'],['on-trip','On Trip','trip'],['trip-complete','Trip Complete','receipt'],['my-trips','My Trips','account'],['wallet','LaBar Credit','account'],['profile','Profile','account'],['guardian-plugin','LaBar Guardian','safety'],['saved-places','Saved Places','account'],['notifications','Notifications','account'],['support','Support','account'],['schedule-ride','Schedule Ride','plan'],['promotions','Promotions','account'],['settings','Settings','account']];
const requestedScreen=location.hash.slice(1);let current=screens.some(s=>s[0]===requestedScreen)?requestedScreen:'splash',distance=2.4,payment='CASH',credits=0;
const icon=(name)=>`<img class="icon" src="/icons/${name}.svg" alt="">`;
const head=(stage,title,lead)=>`<div class="eyebrow">${stage}</div><h2>${title}</h2><p class="lead">${lead}</p>`;
const item=(ico,title,sub,right='')=>`<div class="card row">${icon(ico)}<div class="grow"><b>${title}</b><div class="muted">${sub}</div></div>${right}</div>`;
const paymentItem=(method,label)=>`<button class="payrow ${payment===method?'selected':''}" onclick="payment='${method}';render()"><span class="payicon">${label.slice(0,1)}</span><b>${label}</b><span class="radio"></span></button>`;
const money=n=>new Intl.NumberFormat('en-US').format(n)+' MMK';
function quote(){const steps=Math.max(0,Math.ceil(((distance-2)/.1)-1e-9));const transport=5000+steps*150;const service=1500;const discount=Math.min(transport,credits*10);const subtotal=transport-discount+service;const payable=payment==='CASH'?Math.ceil(subtotal/500)*500:subtotal;return{steps,transport,service,discount,subtotal,rounding:payable-subtotal,payable};}
function fareCard(receipt=false){const q=quote();return `<div class="card ${receipt?'':'gold'}"><div class="fareline"><span>Transport fare</span><b>${money(q.transport)}</b></div><div class="fareline"><span>LaBar service fee</span><b>${money(q.service)}</b></div>${q.discount?`<div class="fareline"><span>Promo credit (${credits})</span><b style="color:var(--green)">-${money(q.discount)}</b></div>`:''}<div class="fareline"><span>Subtotal</span><b>${money(q.subtotal)}</b></div>${q.rounding?`<div class="fareline"><span>Cash rounding</span><b>${money(q.rounding)}</b></div>`:''}<div class="fareline total"><span>${receipt?'Paid':'Payable'}</span><span>${money(q.payable)}</span></div></div>`;}
const views={
'splash':()=>`${head('Secure entry','Move through Yangon with clarity','Verified drivers, transparent pricing, and safety controls designed for every trip.')}<div style="text-align:center;padding:55px 0 40px"><img src="/icons/labar-mark.svg" style="width:110px;color:var(--gold-dark)" alt="LaBar"><div class="metric" style="color:var(--gold-dark)">LaBar</div><div class="muted">Taxi and safety platform</div></div><button class="btn" onclick="openScreen('home')">Continue</button>`,
'home':()=>`${head('Discover','Where are you going?','Book now, schedule a future ride, or begin from a saved place.')}<div class="card row">${icon('finding')}<div class="grow"><b>Search destination</b><div class="muted">Landmark, street, township, or map pin</div></div></div><div class="pills"><span class="pill active">Home · Sanchaung</span><span class="pill">Work · Sule Square</span></div><div class="eyebrow" style="margin-top:18px">Recent places</div>${item('places','Tawma Ocean','Tamwe, Yangon','')}${item('places','Yangon International Airport','Mingaladon, Yangon','')}${item('places','Junction City','Bahan, Yangon','')}<div class="card gold row">${icon('promotions')}<div class="grow"><b>Invite friends</b><div class="muted">Get 1,000 promo credits after their first ride</div></div><button class="pill" onclick="openScreen('promotions')">Share</button></div><button class="btn" onclick="openScreen('pickup-map')">Start a ride</button>`,
'pickup-map':()=>`${head('Plan','Confirm your pickup','Drag the pin to the safe entrance where your driver should stop.')}<div class="map"><i class="pin a"></i></div>${item('places','Sule Square, main entrance','Accuracy 4 m; driver may stop safely','Change')}<div class="card"><label class="muted">Pickup note</label><input class="input" value="Meet beside the south entrance"><div class="pills" style="margin-top:9px"><span class="pill active">Use my location</span><span class="pill">Choose on map</span></div></div><button class="btn" onclick="openScreen('route-fees')">Confirm pickup</button>`,
'route-fees':()=>`${head('Plan','Route and fees','Review the route, distance increments, and fixed service fee before choosing a ride.')}<div class="map"><i class="pin a"></i><i class="pin b"></i></div><div class="card"><label class="muted">Prototype distance (km)</label><input class="input" type="number" min="0.1" step="0.1" value="${distance}" onchange="distance=Number(this.value);render()"><p class="muted">5,000 MMK covers up to 2 km. Each started 0.1 km after that is 150 MMK.</p></div>${fareCard()}<button class="btn" onclick="openScreen('choose-ride')">Choose a ride</button>`,
'choose-ride':()=>`${head('Plan','Choose your ride','Compare arrival time, capacity, and service level.')}<div class="card gold row">${icon('ride')}<div class="grow"><b>Standard</b><div class="muted">4 seats; arrives in 4 min</div></div><b>${money(quote().subtotal)}</b></div>${item('ride','Gold Comfort','4 seats; newer vehicle; arrives in 7 min',money(quote().subtotal+2500))}${item('support','Accessible ride','Extra boarding time and assistance','Request')}<button class="btn" onclick="openScreen('payment')">Continue with Standard</button>`,
'payment':()=>`${head('Checkout','Payment method','Cash is rounded upward to the next 500 MMK. Digital methods use the exact total.')}${paymentItem('CASH','Cash')}${paymentItem('KBZPAY','KBZPay')}${paymentItem('WAVEPAY','WavePay')}${paymentItem('AYAPAY','AYA Pay')}<div class="card"><label class="muted">Use LaBar promo credits (1 credit = 10 MMK)</label><input class="input" type="number" min="0" step="10" value="${credits}" onchange="credits=Math.max(0,Number(this.value));render()"><p class="muted">Credits discount transport fare only. The 1,500 MMK service fee remains due.</p></div>${fareCard()}<button class="btn" onclick="openScreen('finding-driver')">Confirm and find driver</button>`,
'finding-driver':()=>`${head('Dispatch','Finding your driver','The closest eligible driver receives a timed offer before the search expands.')}<div class="map"><i class="pin a"></i><i class="pin b"></i></div><div class="card dark"><div class="row"><div class="metric">09</div><div><b>seconds on current offer</b><div class="muted" style="color:#aeb8ca">Searching within the nearest service zone</div></div></div><div class="progress"><i></i></div></div><button class="btn" onclick="openScreen('driver-on-the-way')">Simulate driver accepted</button><button class="btn secondary">Cancel search</button>`,
'driver-on-the-way':()=>`${head('Pickup','Your driver is on the way','Meet at the confirmed entrance and verify the plate before boarding.')}<div class="map"><i class="pin a"></i><i class="pin b"></i></div><div class="card row">${icon('driver')}<div class="grow"><b>U Aung Kyaw</b><div class="muted">Toyota Fielder; 3A-8492; rating 4.96</div></div><div class="metric">4m</div></div><div class="pills"><span class="pill">Call</span><span class="pill">Message</span><span class="pill active">Pickup code 4281</span></div><button class="btn" onclick="openScreen('driver-details')">View driver details</button>`,
'driver-details':()=>`${head('Pickup','Verified driver details','Check the driver, vehicle, licence status, and safety capabilities.')}<div class="card green" style="text-align:center">${icon('driver')}<h3>U Aung Kyaw</h3><div class="muted">Identity and commercial licence verified</div></div>${item('ride','Toyota Fielder','White; plate 3A-8492; four seats','4.96')}${item('driverreg','Licence status','Commercial licence verified; expiry checked','Valid')}${item('guardian','Trip protection','Guardian sharing and CCTV capability','Ready')}<button class="btn" onclick="openScreen('on-trip')">Simulate trip started</button>`,
'on-trip':()=>`${head('Trip','On trip','Follow the route, current fare, and protection status.')}<div class="map"><i class="pin a"></i><i class="pin b"></i></div><div class="card gold"><div class="muted">Current estimated payable</div><div class="metric">${money(quote().payable)}</div><div class="progress"><i></i></div></div>${item('guardian','Guardian protection active','Live route shared with two family members','On')}<button class="btn secondary" onclick="document.getElementById('safety').classList.toggle('open')">Safety and emergency options</button><div class="card safety" id="safety"><b>Discreet Safety Drawer</b><p class="muted">Hold to send silent SOS, share live location, record evidence, or call emergency services.</p><button class="btn danger">Hold for silent SOS</button></div><button class="btn" onclick="openScreen('trip-complete')">Simulate arrival</button>`,
'trip-complete':()=>`${head('Receipt','Trip complete','Your final receipt uses the same server fare policy shown before booking.')}<div class="card green" style="text-align:center">${icon('receipt')}<h3>Payment complete</h3><div class="metric">${money(quote().payable)}</div><div class="muted">Receipt LBR-260824-1042</div></div><div class="receipt">${fareCard(true)}</div>${item('route','Sule Square to Junction City',distance.toFixed(1)+' km; 18 minutes','View route')}${item('wallet','Credit activity','Promo credits used: '+credits,'View')}<div class="pills"><span class="pill">Rate driver</span><span class="pill">Get help</span><span class="pill active">Download receipt</span></div><button class="btn" onclick="openScreen('home')">Done</button>`,
'my-trips':()=>`${head('Account','My trips','Upcoming, active, and completed rides with receipts and support links.')}${item('schedule','Tomorrow, 08:30','Home to Yangon International Airport','Upcoming')}${item('receipt','Junction City','Today; '+money(quote().payable),'Receipt')}${item('history','Bogyoke Market','21 Aug; 7,500 MMK','Completed')}`,
'profile':()=>`${head('Account','Profile','Manage identity, contacts, Guardian links, and privacy choices.')}${item('profile','Ma Thiri','Passenger since March 2025','Edit')}${item('support','Emergency contact','Daw Mya Mya; Mother','Edit')}${item('guardian','Family guardians','Two people paired','Manage')}${item('settings','Privacy and security','Passkey, devices, data controls','Open')}`,
'wallet':()=>`${head('Account','LaBar Credit','Promotional ride credit. One credit equals 10 MMK and cannot remove the service fee.')}<div class="card dark"><div class="muted" style="color:#aeb8ca">Available balance</div><div class="metric">1,240 credits</div><b>Value: ${money(12400)}</b></div>${item('wallet','Welcome promotion','+1,000 credits','Earned')}${item('ride','Ride discount','-100 credits','Used')}${item('support','Credit terms','Expiry, eligible fares, and disputes','Read')}`,
'guardian-plugin':()=>`${head('Safety','Guardian plugin','Pair trusted family, choose sharing rules, and monitor protection status.')}${item('plugin','Guardian 1.4','Installed; permissions reviewed','Active')}${item('guardian','Family members','Daw Mya Mya and Ko Min','Manage')}${item('route','Sharing policy','Only during active trips','Change')}<button class="btn">Open Guardian dashboard</button>`,
'saved-places':()=>`${head('Account','Saved places','Store reliable pickup entrances and notes, not only map coordinates.')}${item('home','Home','Sanchaung; east gate','Edit')}${item('admin','Work','Sule Square; south entrance','Edit')}${item('places','Add a place','Name, pin, entrance, and driver note','Add')}`,
'notifications':()=>`${head('Account','Notifications','Trip, payment, promotion, and system updates in one place.')}<div class="pills"><span class="pill active">All</span><span class="pill">Trips</span><span class="pill">Promos</span><span class="pill">System</span></div>${item('route','Driver on the way','Ko Min is arriving in 3 minutes','10:26 AM')}${item('promotions','20% off Comfort rides','Valid until 31 August','May 19')}${item('payment','Payment successful','Fare 5,800 MMK','May 18')}${item('receipt','Trip completed','Thanks for riding with LaBar','May 18')}<button class="btn secondary">Mark all as read</button>`,
'support':()=>`${head('Help','Support','Choose the issue type so the right team receives the trip and payment context.')}${item('guardian','Safety issue','Urgent incident or follow-up','Open')}${item('trip','Trip issue','Driver, route, cancellation, or lost item','Open')}${item('payment','Payment issue','Cash, e-wallet, receipt, or credit','Open')}${item('support','My support cases','Track replies and resolution','View')}`,
'schedule-ride':()=>`${head('Plan','Schedule a ride','Set a future pickup with reminders and a clear edit/cancel window.')}<div class="card"><label class="muted">Pickup date and time</label><input class="input" type="datetime-local" value="2026-08-25T08:30"></div>${item('places','Home, east gate','Pickup location','Change')}${item('places','Yangon International Airport','Destination','Change')}${fareCard()}<button class="btn">Schedule ride</button>`,
'promotions':()=>`${head('Account','Promotions','Apply a verified offer before payment and see its exact eligibility.')}<div class="card gold"><b>20% off Comfort rides</b><p class="muted">Valid until 31 August. Maximum discount 2,000 MMK.</p><button class="btn secondary">Use now</button></div><div class="card"><b>1,000 MMK off airport rides</b><p class="muted">Valid until 30 September. One use per passenger.</p><button class="btn secondary">Use now</button></div>${item('promotions','Invite friends','Get 1,000 promo credits after their first trip','Share')}`,
'settings':()=>`${head('Account','Settings','Control language, notifications, accessibility, privacy, and account security.')}${item('settings','Language','Myanmar and English','Change')}${item('support','Notifications','Trips, payments, promotions, safety','Manage')}${item('guardian','Accessibility','Large text, voice guidance, reduced motion','Manage')}${item('profile','Security','Passkey, devices, sign-out','Open')}`
};
function render(){const meta=screens.find(s=>s[0]===current);document.querySelector('.phone').dataset.screen=current;document.getElementById('screenname').textContent=meta[1];document.getElementById('content').innerHTML=views[current]();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase().includes(meta[1].toLowerCase().split(' ')[0])));document.getElementById('picker').value=current;document.getElementById('stagebar').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===current));}
function openScreen(id){if(!screens.some(s=>s[0]===id))return;current=id;if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);render();}
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(screens.some(s=>s[0]===id)){current=id;render();}});document.getElementById('picker').innerHTML=screens.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');document.getElementById('stagebar').innerHTML=screens.map(s=>`<button data-id="${s[0]}" onclick="openScreen('${s[0]}')">${s[1]}</button>`).join('');render();
</script></body></html>
