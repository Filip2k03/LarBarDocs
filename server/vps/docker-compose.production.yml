version: '3.9'

# ==============================================================================
# LaBar Production Stack — Hostinger KVM 4 (4 vCPU, 16 GB RAM, 200 GB NVMe)
# Server: srv1929874.hstgr.cloud (187.52.126.130) | Primary: labartaxi.com
# Database: External Managed Cluster at https://db.reiwasakura.tech/
# ==============================================================================

networks:
  labar-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Edge Reverse Proxy & Automatic TLS (Caddy 2)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: labar_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/labar/storage/cdn:/opt/labar/storage/cdn:ro
      - /var/log/caddy:/var/log/caddy
    networks:
      - labar-net
    depends_on:
      - labar-api
      - labar-public-web
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 2. Central Go REST & Realtime WebSocket Backend API
  # ----------------------------------------------------------------------------
  labar-api:
    build:
      context: ../../codebase/backend
      dockerfile: Dockerfile
    container_name: labar_api_core
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ENVIRONMENT=production
      - HTTP_ADDR=:8080
      - DATABASE_URL=${DATABASE_URL:-postgres://labar_user:secure_pwd@db.reiwasakura.tech:5432/labar_production?sslmode=require}
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_WEB_ORIGINS=https://labartaxi.com,https://www.labartaxi.com,https://admin.labartaxi.com,https://driverreg.labartaxi.com
      - JWT_SECRET=${JWT_SECRET}
      - OTP_SECRET=${OTP_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=labar-media
      - S3_USE_SSL=false
      - S3_PUBLIC_URL=https://storage.labartaxi.com
      - SMS_PROVIDER=${SMS_PROVIDER:-mpt_direct}
      - DEVELOPMENT_OTP=false
    networks:
      - labar-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. Asynchronous Worker (SMS, Push, SOS Broadcasts, Settlement Queue)
  # ----------------------------------------------------------------------------
  labar-worker:
    build:
      context: ../../codebase/backend
      dockerfile: Dockerfile
    container_name: labar_worker_proc
    restart: unless-stopped
    command: ["./worker"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:-postgres://labar_user:secure_pwd@db.reiwasakura.tech:5432/labar_production?sslmode=require}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - OTP_SECRET=${OTP_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SMS_PROVIDER=${SMS_PROVIDER:-mpt_direct}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - APNS_KEY_PATH=${APNS_KEY_PATH:-}
    networks:
      - labar-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 4. Public Website (Astro.js SSR/Static Node Container)
  # ----------------------------------------------------------------------------
  labar-public-web:
    build:
      context: ../../labar-public-web
      dockerfile: Dockerfile
      args:
        - PUBLIC_SITE_URL=https://labartaxi.com
        - PUBLIC_API_BASE_URL=https://api.labartaxi.com/api/v1
        - PUBLIC_CDN_URL=https://cdn.labartaxi.com
        - PUBLIC_STORAGE_URL=https://storage.labartaxi.com
        - PUBLIC_APP_ENV=production
    container_name: labar_public_web
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_SITE_URL=https://labartaxi.com
      - PUBLIC_API_BASE_URL=https://api.labartaxi.com/api/v1
    networks:
      - labar-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 5. Executive & Staff Admin Control Center Web Portal
  # ----------------------------------------------------------------------------
  labar-admin-portal:
    build:
      context: ../../codebase/frontend/apps/admin-portal
      dockerfile: Dockerfile
    container_name: labar_admin_portal
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - labar-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 6. Assisted Driver Registration Portal
  # ----------------------------------------------------------------------------
  labar-driverreg:
    build:
      context: ../../codebase/frontend/apps/driverreg
      dockerfile: Dockerfile
    container_name: labar_driverreg_web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - labar-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 7. In-Memory Cache & Spatial Geo-Index (Redis 7 Alpine)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: labar_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy volatile-lru
      --save 900 1
      --save 300 10
      --tcp-backlog 65535
      --timeout 0
    volumes:
      - redis_data:/data
    networks:
      - labar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2560M

  # ----------------------------------------------------------------------------
  # 8. S3-Compatible Object Storage (MinIO S3 API & Console)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: labar_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-labar_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-ChangeThisMinIOStrongPass2026!}
      - MINIO_SERVER_URL=https://storage.labartaxi.com
      - MINIO_BROWSER_REDIRECT_URL=https://minio-admin.labartaxi.com
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - labar-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
