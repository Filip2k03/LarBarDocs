<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LaBar DriverReg — Interactive KYC Prototype</title>
  <style>
    :root{--red:#e5252a;--red2:#b91c1c;--gold:#f59e0b;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--ok:#059669;--blue:#2563eb}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff7ed,#f8fafc 42%,#eff6ff);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .page{max-width:1180px;margin:auto;padding:28px}.top{text-align:center;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top p{margin:6px auto;color:var(--muted);max-width:780px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 2px 16px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:750;color:#475569;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .phone{width:390px;min-height:844px;margin:auto;background:#fff;border:8px solid var(--ink);border-radius:45px;box-shadow:0 28px 70px #0f172a2b;overflow:hidden;position:relative}.island{width:125px;height:27px;border-radius:0 0 16px 16px;background:var(--ink);margin:auto}.appbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px}.brand{font-size:20px;font-weight:900;color:#d97706}.tag{font-size:10px;font-weight:900;color:var(--blue);background:#dbeafe;border-radius:999px;padding:4px 8px}.case{margin-left:auto;color:var(--muted);font-size:10px}.body{padding:18px 18px 88px}.step{font-size:11px;font-weight:850;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}.body h2{margin:5px 0 5px;font-size:23px;line-height:1.15}.lead{color:var(--muted);margin:0 0 16px}.progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));width:var(--p)}
    .card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;margin:10px 0;box-shadow:0 5px 16px #0f172a0a}.card.soft{background:#f8fafc}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:10px;color:#475569;font-weight:800;margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em}.field input,.field select{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px;color:var(--ink);font:inherit}.field input.good{border-color:#34d399;background:#ecfdf5}.confidence{float:right;color:var(--ok);font-weight:900}.scan{height:270px;background:#111827;border-radius:18px;display:grid;place-items:center;overflow:hidden;position:relative}.scan img{max-width:92%;max-height:92%;border-radius:10px}.scan:after{content:"ALIGN LICENCE INSIDE FRAME";position:absolute;left:14px;right:14px;bottom:12px;padding:8px;border-radius:8px;text-align:center;background:#0f172acc;color:#fff;font-size:10px;font-weight:900;letter-spacing:.09em}.portrait{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px #34d399}.score{font-size:28px;font-weight:900;color:var(--ok)}.status{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:5px 9px;background:#d1fae5;color:#047857;font-weight:850;font-size:11px}.warn{background:#fff7ed;color:#c2410c}.check{display:flex;gap:9px;align-items:flex-start;margin:11px 0}.check input{margin-top:3px}.actions{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:9px}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),#d97706);color:#fff;flex:1}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;flex:1}.summary{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.summary:last-child{border:0}.mini{font-size:11px;color:var(--muted)}
    @media(max-width:600px){.page{padding:12px 0}.top,.tabs{padding-left:12px;padding-right:12px}.phone{width:min(390px,100vw);border-width:0;border-radius:0;min-height:100vh}.tabs{margin-bottom:0}}
  </style>
</head>
<body>
<main class="page">
  <div class="top"><h1>🪪 LaBar DriverReg</h1><p>Staff-assisted driver identity, licence, face, vehicle, and compliance registration. Demo data only.</p></div>
  <nav class="tabs" id="tabs"></nav>
  <section class="phone"><div class="island"></div><header class="appbar"><span class="brand">LaBar</span><span class="tag">DRIVERREG</span><span class="case">CASE DREG-260823-014</span></header><div class="body" id="screen"></div></section>
</main>
<script>
const labels=['Staff Sign-in','Consent','Personal','NRC','Licence Scan','OCR Review','Face Match','Vehicle','Review','Status'];
let step=0;
const field=(label,value,good=false)=>`<div class="field"><label>${label}${good?'<span class="confidence">✓ 96%</span>':''}</label><input class="${good?'good':''}" value="${value}"></div>`;
const shell=(title,lead,content,next='Continue')=>`<div class="step">Step ${step+1} of ${labels.length}</div><h2>${title}</h2><p class="lead">${lead}</p><div class="progress" style="--p:${(step+1)*10}%"><i></i></div>${content}<div class="actions">${step?'<button class="btn secondary" onclick="go(-1)">Back</button>':''}<button class="btn primary" onclick="go(1)">${next}</button></div>`;
const screens=[
()=>shell('Authorized staff sign-in','Registration sessions are bound to a verified staff account, branch, and device.',`<div class="card">${field('Staff ID or phone','REG-YGN-0042')}${field('Password / passkey','••••••••••')}<div class="row">${field('Branch','Yangon Central')}${field('Device','iPhone • 7A3F')}</div>${field('MFA code','849 201')}<div class="status">● Device trusted for this shift</div></div><p class="mini">Every document view and correction is recorded under this staff identity.</p>`,'Verify & sign in'),
()=>shell('Driver consent & case','Explain the purpose before capturing identity or biometric data.',`<div class="card soft"><b>We will collect</b><p class="mini">NRC, driving licence, selfie/liveness, profile image, vehicle and commercial documents.</p><b>We use it for</b><p class="mini">Driver eligibility, fraud prevention, account activation, trip safety, and regulatory audits.</p></div><label class="check"><input type="checkbox" checked> <span>The driver gives informed consent to capture and verify these records.</span></label><label class="check"><input type="checkbox" checked> <span>The driver received the privacy and retention notice.</span></label><div class="card"><b>Assisting staff</b><div class="mini">Mya Mya • REG-YGN-0042 • Yangon Central</div></div>`,'Create KYC case'),
()=>shell('Personal details','Age is calculated from DOB and is not stored as a separate authoritative value.',`<div class="card">${field('Full legal name','MYINT KYAW')}<div class="row">${field('Date of birth','1973-03-15')}${field('Age (calculated)','53')}</div>${field('Mobile number','09 7•• ••• ••42')}<div class="row">${field('Preferred language','Myanmar')}${field('Township','Aung Yadanar')}</div>${field('Residential address','No. 49, 19 St, Aung Yadanar Qtr, Magway')}${field('Emergency contact','Daw Hnin • Spouse • 09 7•• ••• ••81')}</div>`),
()=>shell('Capture NRC','Scan front and back. The number is masked outside this case detail.',`<div class="scan" style="height:210px"><div style="color:#fff;text-align:center"><div style="font-size:54px">▣</div><b>NRC FRONT</b><div class="mini" style="color:#94a3b8">Edges detected • Hold steady</div></div></div><div class="card"><div class="status">✓ Front quality passed</div><div class="status">✓ Back quality passed</div>${field('Normalized NRC','8/MABANA(N)000903',true)}<div class="row">${field('State / region','8',true)}${field('Township code','MABANA',true)}</div></div>`,'Confirm NRC'),
()=>shell('Scan driving licence','Position the licence inside the guide. The prototype uses the supplied sample image.',`<div class="scan"><img src="/idscan/drivinglicencesample.jpeg" alt="Myanmar driving licence sample"></div><div class="row"><div class="card"><b>✓ Front</b><div class="mini">Sharp • no glare</div></div><div class="card"><b>✓ Back</b><div class="mini">Barcode detected</div></div></div>`,'Run OCR'),
()=>shell('Review OCR autofill','Green fields are high-confidence. Staff must confirm orange or conflicting values.',`<div class="card">${field('Licence number','B/00548/11',true)}${field('Driver name','MYINT KYAW',true)}${field('NRC number','8/MABANA(N)000903',true)}<div class="row">${field('Date of birth','1973-03-15',true)}${field('Blood type','B',true)}</div><div class="row">${field('Licence class','B',true)}${field('Valid to','2024-11-24')}</div><span class="status warn">! Expired date — manual review required</span></div><p class="mini">Corrections preserve the original OCR value, confidence, staff ID, and timestamp.</p>`,'Confirm fields'),
()=>shell('Selfie & liveness','Match a live selfie to the document portrait; do not auto-approve from similarity alone.',`<div class="card" style="text-align:center"><img class="portrait" src="/idscan/drivinglicencesample.jpeg" alt="Profile crop demonstration"><h3>Turn left • Blink • Look forward</h3><div class="score">94%</div><div class="mini">Face similarity • Liveness passed</div><div class="status">✓ Manual reviewer still required</div></div><div class="row"><div class="card"><b>Profile image</b><div class="mini">Encrypted original</div></div><div class="card"><b>Liveness</b><div class="mini">Provider v2.4</div></div></div>`,'Accept capture'),
()=>shell('Vehicle & compliance','Capture the vehicle identity and every expiry that can block activation.',`<div class="card"><div class="row">${field('Car / plate number','4B-9102')}${field('Vehicle type','Standard Taxi')}</div><div class="row">${field('Make & model','Toyota Fielder')}${field('Model year','2018')}</div><div class="row">${field('Color','White')}${field('Seats','4')}</div>${field('Chassis / VIN','NZE161-••••642')}${field('Engine number','1NZ-••••281')}<div class="row">${field('Insurance expiry','2027-02-14')}${field('RTAD inspection','2027-01-08')}</div><div class="row">${field('Wheel tax expiry','2026-12-31')}${field('CCTV hardware ID','CCTV-YGN-8821')}</div></div>`),
()=>shell('Review & submit','Resolve blocking mismatches before sending the case to an independent reviewer.',`<div class="card"><div class="summary"><span>Personal details</span><span class="status">Complete</span></div><div class="summary"><span>NRC</span><span class="status">Verified</span></div><div class="summary"><span>Driving licence</span><span class="status warn">Expired sample</span></div><div class="summary"><span>Face & liveness</span><span class="status">Passed</span></div><div class="summary"><span>Vehicle compliance</span><span class="status">Complete</span></div></div><label class="check"><input type="checkbox" checked><span>I attest that I compared the originals and recorded corrections truthfully.</span></label>`,`Submit for review`),
()=>shell('Case received','This demonstration case is routed to manual review because the sample licence is expired.',`<div class="card" style="text-align:center;padding:28px"><div style="font-size:52px">⏳</div><h3>Needs reviewer decision</h3><div class="status warn">SLA: within 1 business day</div><p class="mini">Case DREG-260823-014<br>Driver: MYINT KYAW • Plate 4B-9102</p></div><div class="card"><b>Next action</b><p class="mini">A KYC reviewer can request a current licence, approve after verified replacement, or reject with a policy reason. The Driver App remains inactive until approval.</p></div>`,'Restart prototype')
];
function render(){document.getElementById('tabs').innerHTML=labels.map((x,i)=>`<button class="${i===step?'active':''}" onclick="step=${i};render()">${i+1}. ${x}</button>`).join('');document.getElementById('screen').innerHTML=screens[step]();}
function go(delta){step+=delta;if(step>=screens.length)step=0;if(step<0)step=0;render();}
render();
</script>
</body>
</html>
