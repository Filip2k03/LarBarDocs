<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LarBar Passenger App — Interactive Mobile Prototype</title>
  <style>
    :root {
      --bg: #0E0F14;
      --card: #181922;
      --card-elevated: #242533;
      --border: #282836;
      --gold-primary: #F59E0B;
      --gold-light: #FFD54F;
      --red-primary: #E5252A;
      --emerald: #10B981;
      --text: #FFFFFF;
      --text-muted: #9CA3AF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pyidaungsu', sans-serif; }
    body { background: #07080B; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }
    
    .header-nav { text-align: center; margin-bottom: 24px; max-width: 600px; }
    .header-nav h1 { color: var(--gold-primary); font-size: 24px; margin-bottom: 8px; font-weight: 900; }
    .header-nav p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--gold-primary); color: #181922; border-color: var(--gold-primary); font-weight: 800; }

    /* Phone Shell */
    .phone-container {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 44px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8), 0 0 0 8px #181922;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .island { width: 120px; height: 28px; background: #000; border-radius: 14px; margin: 10px auto 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; }
    .island-cam { width: 8px; height: 8px; border-radius: 50%; background: #181922; }
    .status-bar { display: flex; justify-content: space-between; padding: 4px 28px 8px; font-size: 12px; font-weight: 600; }
    .app-header { background: rgba(24, 25, 34, 0.95); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .app-header .logo { color: var(--gold-primary); font-size: 18px; font-weight: 900; }
    .app-header .title { font-size: 13px; font-weight: 700; }

    .content-viewport { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .home-indicator { width: 130px; height: 4px; background: #484856; border-radius: 2px; margin: 8px auto 12px; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .btn-gold { background: linear-gradient(135deg, var(--gold-light), var(--gold-primary)); color: #181922; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 15px; width: 100%; cursor: pointer; text-align: center; }
    .btn-red { background: linear-gradient(135deg, #F85A5A, var(--red-primary)); color: #FFF; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 15px; width: 100%; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="header-nav">
    <h1>🚖 LarBar Passenger App Interactive Prototype</h1>
    <p>Click the interactive steps below to simulate the end-to-end booking, dispatch, in-trip, and payment lifecycle.</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchStep(1)">1. Multi-Stop Booking</button>
      <button class="tab-btn" onclick="switchStep(2)">2. 15s Cascading Dispatch</button>
      <button class="tab-btn" onclick="switchStep(3)">3. In-Trip Live Meter</button>
      <button class="tab-btn" onclick="switchStep(4)">4. Receipt & Rating</button>
    </div>
  </div>

  <div class="phone-container">
    <div class="island"><div class="island-cam"></div></div>
    <div class="status-bar"><span>9:41</span><span>5G 🔋 100%</span></div>
    
    <div class="app-header">
      <span class="logo">LarBar</span>
      <span class="title" id="screen-title">ခရီးစဥ်မှာယူခြင်း</span>
      <span>🔔</span>
    </div>

    <div class="content-viewport" id="viewport">
      <!-- Injected step content -->
    </div>

    <div class="home-indicator"></div>
  </div>

  <script>
    const steps = [
      {
        title: 'ခရီးစဥ်မှာယူခြင်း (Ride Booking)',
        html: `
          <div style="height: 200px; background: #14151D; border: 1px solid var(--border); border-radius: 16px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            <div style="position: absolute; color: var(--gold-primary); font-weight: 900; font-size: 14px;">🗺️ LIVE YANGON DOWNTOWN MAP</div>
            <div style="position: absolute; bottom: 12px; left: 16px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 8px; font-size: 11px; color: var(--emerald);">🚖 3 Taxis nearby (2-4 mins)</div>
          </div>

          <div class="card">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
              <span style="color: var(--emerald);">●</span>
              <span style="font-size: 13px; font-weight: 600;">Sule Square, Downtown</span>
            </div>
            <div style="border-left: 2px dashed #484856; margin-left: 5px; height: 16px;"></div>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
              <span style="color: var(--gold-primary);">●</span>
              <span style="font-size: 12px; color: var(--gold-light);">Stop: Bogyoke Aung San Market</span>
            </div>
            <div style="border-left: 2px dashed #484856; margin-left: 5px; height: 16px;"></div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <span style="color: var(--red-primary);">●</span>
              <span style="font-size: 13px; font-weight: 600;">Junction City Mall</span>
            </div>
          </div>

          <div class="card" style="border: 2px solid var(--gold-primary);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-weight: 800; font-size: 14px;">🚗 Standard Taxi (4 Seats)</div>
                <div style="font-size: 11px; color: var(--text-muted);">Toyota Probox / Fielder • 3m away</div>
              </div>
              <div style="color: var(--gold-primary); font-size: 18px; font-weight: 900;">2,800 MMK</div>
            </div>
          </div>

          <button class="btn-gold" onclick="switchStep(2)">ခရီးစဥ် ခေါ်ယူမည် (CALL TAXI NOW)</button>
        `
      },
      {
        title: 'ယာဥ်မောင်း ရှာဖွေနေသည် (15s Cascading)',
        html: `
          <div class="card" style="text-align: center; padding: 32px 16px;">
            <div style="font-size: 48px; margin-bottom: 12px;">📡</div>
            <div style="color: var(--gold-primary); font-size: 18px; font-weight: 800; margin-bottom: 6px;">15s Cascading Dispatch Active</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Offering to nearest driver: U Aung Kyaw (240m away)</div>
            <div style="background: var(--card-elevated); border-radius: 12px; padding: 12px; font-size: 13px;">
              ⏱️ Offer expires in: <b style="color: var(--gold-primary);">9 seconds</b>
            </div>
          </div>

          <div class="card">
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Pickup ➔ Destination:</div>
            <div style="font-weight: 700; font-size: 13px;">Sule Square ➔ Junction City (5.4 km)</div>
            <div style="font-size: 12px; color: var(--gold-primary); margin-top: 6px;">Est. Fare: 2,800 MMK (KBZPay Direct)</div>
          </div>

          <button class="btn-gold" onclick="switchStep(3)">Simulate Driver Accepted ➔</button>
          <button style="background: transparent; border: 1px solid var(--red-primary); color: var(--red-primary); padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;" onclick="switchStep(1)">မခေါ်ယူတော့ပါ (Cancel Search)</button>
        `
      },
      {
        title: 'ခရီးစဥ် လိုက်ပါနေသည် (In-Trip)',
        html: `
          <div style="height: 180px; background: #14151D; border: 1px solid var(--border); border-radius: 16px; position: relative; display: flex; align-items: center; justify-content: center;">
            <div style="color: var(--emerald); font-weight: 800; font-size: 13px;">📍 Live Navigation: 42 km/h on Pyay Road</div>
          </div>

          <div class="card" style="border: 2px solid var(--gold-primary);">
            <div style="font-size: 11px; color: var(--text-muted);">လက်ရှိ မီတာခ (Dynamic Taximeter)</div>
            <div style="color: var(--gold-primary); font-size: 28px; font-weight: 900; margin: 4px 0;">2,350 MMK</div>
            <div style="font-size: 11px; color: #38BDF8;">Distance: 4.2 km • Duration: 11m 40s</div>
          </div>

          <div class="card">
            <div style="display: flex; gap: 12px; align-items: center;">
              <div style="font-size: 28px;">👨🏻‍✈️</div>
              <div>
                <div style="font-weight: 800; font-size: 14px;">U Aung Kyaw (Toyota Fielder)</div>
                <div style="font-size: 11px; color: var(--gold-primary);">⭐ 4.96 • Plate: 3A-8492</div>
              </div>
            </div>
            <div style="margin-top: 10px; font-size: 11px; color: var(--emerald); font-weight: 700;">📹 In-Car CCTV Protecting: ACTIVE</div>
          </div>

          <button class="btn-red" onclick="alert('🚨 SOS Panic Alarm Broadcasted to Family Guardian & Police!')">🚨 EMERGENCY SOS PANIC</button>
          <button class="btn-gold" onclick="switchStep(4)">Simulate Arrived at Destination ➔</button>
        `
      },
      {
        title: 'ခရီးစဥ်ပြီးဆုံးခြင်း (Receipt & Rating)',
        html: `
          <div class="card" style="text-align: center; padding: 24px 16px; border: 2px solid var(--emerald);">
            <div style="font-size: 36px; margin-bottom: 8px;">✓</div>
            <div style="font-weight: 800; font-size: 16px;">ခရီးစဥ် ပြီးဆုံးပါပြီ</div>
            <div style="color: var(--gold-primary); font-size: 32px; font-weight: 900; margin: 6px 0;">2,800 MMK</div>
            <div style="font-size: 12px; color: #38BDF8;">Paid via KBZPay Direct (Auto Settled)</div>
          </div>

          <div class="card" style="text-align: center;">
            <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">Rate U Aung Kyaw:</div>
            <div style="color: var(--gold-primary); font-size: 24px; letter-spacing: 6px; margin-bottom: 12px;">★★★★★</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">Add Tip (မုန့်ဖိုးပေးမည်):</div>
            <div style="display: flex; gap: 8px; justify-content: center;">
              <button style="background: var(--card-elevated); border: 1px solid var(--border); color: #FFF; padding: 6px 12px; border-radius: 8px; font-size: 11px;">+500 MMK</button>
              <button style="background: var(--card-elevated); border: 1px solid var(--gold-primary); color: var(--gold-primary); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;">+1,000 MMK</button>
              <button style="background: var(--card-elevated); border: 1px solid var(--border); color: #FFF; padding: 6px 12px; border-radius: 8px; font-size: 11px;">+2,000 MMK</button>
            </div>
          </div>

          <button class="btn-gold" onclick="switchStep(1)">ပြီးဆုံးပါပြီ (DONE &amp; NEW RIDE)</button>
        `
      }
    ];

    function switchStep(stepNum) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', i === stepNum - 1);
      });
      const s = steps[stepNum - 1];
      document.getElementById('screen-title').innerText = s.title;
      document.getElementById('viewport').innerHTML = s.html;
    }

    switchStep(1);
  </script>
</body>
</html>
