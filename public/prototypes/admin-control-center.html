<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LaBar Admin Control Center — Interactive Prototype</title>
  <style>
    :root{--ink:#0f172a;--nav:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--gold:#f59e0b;--red:#e5252a;--ok:#059669;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:24px 16px}.logo{font-size:23px;font-weight:950;color:var(--gold);margin:0 10px 24px}.who{background:#ffffff12;border:1px solid #ffffff1f;border-radius:14px;padding:12px;margin:0 0 20px}.who small{color:#94a3b8}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:9px;margin:2px 0;font-weight:750}.nav button.active{background:#ffffff16;color:#fff}.main{padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0;font-size:27px}.head p{margin:4px 0;color:var(--muted)}.chip{display:inline-block;border-radius:999px;padding:5px 9px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:850}.chip.ok{background:#d1fae5;color:#047857}.chip.warn{background:#ffedd5;color:#c2410c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 5px 18px #0f172a0a}.metric b{display:block;font-size:26px;margin-top:6px}.metric span{color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.case{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.doc{height:220px;background:#ecfccb;border:1px solid #bef264;border-radius:12px;display:grid;place-items:center;text-align:center}.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:850}.btn.gold{background:var(--gold);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.light{background:#fff;border:1px solid var(--line)}.actions{display:flex;gap:8px;margin-top:14px}.role{display:grid;grid-template-columns:190px 1fr 130px;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.note{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.login{max-width:470px;margin:70px auto}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;color:#475569;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.audit{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.audit time{width:150px;color:var(--muted)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.grid{grid-template-columns:1fr 1fr}.case{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="app"><aside class="side"><div class="logo">LaBar Control</div><div class="who"><b>Ko Zaw Min</b><br><small>PSO • Executive Superadmin</small></div><nav class="nav" id="nav"></nav></aside><main class="main" id="main"></main></div>
<script>
const pages=['Dashboard','Driver review','Staff accounts','Roles & access','Audit log'];let page=0;
const header=(title,sub)=>`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><span class="chip">MFA VERIFIED</span></div>`;
const dashboard=()=>`${header('Operations dashboard','Driver verification, safety, and access-control overview.')}<div class="grid"><div class="card metric"><span>Pending driver cases</span><b>24</b><i class="chip warn">6 near SLA</i></div><div class="card metric"><span>Needs correction</span><b>11</b><i class="chip">Owner notified</i></div><div class="card metric"><span>Approved today</span><b>18</b><i class="chip ok">Median 3h 42m</i></div><div class="card metric"><span>Active staff sessions</span><b>37</b><i class="chip ok">No anomaly</i></div></div><div class="card" style="margin-top:16px"><h3>Priority review queue</h3><table class="table"><tr><th>Case</th><th>Driver</th><th>Branch</th><th>Risk</th><th>Status</th></tr><tr onclick="page=1;render()"><td>DREG-260823-014</td><td>MYINT KYAW</td><td>Yangon Central</td><td><span class="chip warn">Expired licence</span></td><td>Manual review</td></tr><tr><td>DREG-260823-013</td><td>Daw Mya Win</td><td>Hlaing</td><td><span class="chip">Face retry</span></td><td>Needs correction</td></tr><tr><td>DREG-260823-012</td><td>Ko Aung Naing</td><td>Kamayut</td><td><span class="chip ok">Clear</span></td><td>Ready</td></tr></table></div>`;
const review=()=>`${header('Driver case DREG-260823-014','Independent comparison of source images, OCR, selfie/liveness, and vehicle records.')}<div class="case"><div class="card"><div class="doc"><div><b>Myanmar Driving Licence</b><p>Front/back encrypted preview<br>Full view requires a recorded reason</p><span class="chip warn">Expired 24 Nov 2024</span></div></div><h3>OCR comparison</h3><div class="kv"><span>Name</span><b>MYINT KYAW <i class="chip ok">96%</i></b></div><div class="kv"><span>NRC</span><b>8/MABANA(N)••0903 <i class="chip ok">97%</i></b></div><div class="kv"><span>DOB</span><b>15 Mar 1973 <i class="chip ok">99%</i></b></div><div class="kv"><span>Licence</span><b>B/00548/11 <i class="chip ok">95%</i></b></div></div><div><div class="card"><h3>Identity checks</h3><div class="kv"><span>Liveness</span><b class="chip ok">Passed</b></div><div class="kv"><span>Face similarity</span><b>94% • review passed</b></div><div class="kv"><span>NRC cross-check</span><b class="chip ok">Exact</b></div><div class="kv"><span>Duplicate check</span><b class="chip ok">No match</b></div></div><div class="card"><h3>Vehicle</h3><div class="kv"><span>Plate</span><b>4B-9102</b></div><div class="kv"><span>Type</span><b>Standard Taxi</b></div><div class="kv"><span>Inspection</span><b>8 Jan 2027</b></div></div><div class="note">Blocking issue: the demonstration licence is expired. Request a current licence; do not approve this sample case.</div><div class="actions"><button class="btn light">Reject with reason</button><button class="btn red">Request correction</button><button class="btn gold" disabled>Approve</button></div></div></div>`;
const staff=()=>`${header('Staff accounts','Invite staff with least privilege; promotions require a separate authorized actor.')}<div class="card"><h3>Invite staff member</h3><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Full name</label><input value="Thandar Aye"></div><div class="field"><label>Work phone/email</label><input value="thandar@labar.example"></div><div class="field"><label>Role</label><select><option>MARKETER</option><option>DRIVER_REGISTRAR</option><option>SUPPORT</option><option>STAFF_REGISTRAR</option></select></div><div class="field"><label>Branch</label><select><option>Yangon Central</option></select></div></div><div class="note">This form cannot grant GOD_ADMIN, EXEC_SUPERADMIN, KYC_MANAGER, AUDITOR, or any role above the inviter.</div><div class="actions"><button class="btn gold">Send secure invitation</button></div></div><div class="card" style="margin-top:16px"><table class="table"><tr><th>Staff</th><th>Role</th><th>Branch</th><th>MFA</th><th>Status</th></tr><tr><td>Mya Mya</td><td>Driver Registrar</td><td>Yangon Central</td><td>Passkey</td><td><span class="chip ok">Active</span></td></tr><tr><td>Thura Lin</td><td>Marketer</td><td>Hlaing</td><td>TOTP</td><td><span class="chip ok">Active</span></td></tr></table></div>`;
const roles=()=>`${header('Roles & access','CEO, CTO, and PSO share one executive-superadmin permission set.')}<div class="card"><div class="role"><b>GOD_ADMIN</b><span>Break-glass owner; creates/revokes executive superadmins; hardware MFA; no daily use.</span><span class="chip warn">1 account</span></div><div class="role"><b>EXEC_SUPERADMIN</b><span>CEO / CTO / PSO labels; equal permissions, configuration, audit, and session revocation.</span><span class="chip">3 accounts</span></div><div class="role"><b>KYC_MANAGER / REVIEWER</b><span>Assign and decide driver cases; cannot provision privileged staff.</span><span class="chip">8 accounts</span></div><div class="role"><b>DRIVER_REGISTRAR</b><span>Create, edit, and submit branch cases; cannot approve.</span><span class="chip">26 accounts</span></div><div class="role"><b>STAFF_REGISTRAR</b><span>May invite only marketer, support, or registrar roles; no elevation.</span><span class="chip">4 accounts</span></div><div class="role"><b>MARKETER</b><span>Create consented driver leads and view aggregated campaign results.</span><span class="chip">14 accounts</span></div></div>`;
const audit=()=>`${header('Immutable audit log','Every sensitive view, decision, invitation, role change, and session revocation is recorded.')}<div class="card"><div class="audit"><time>23 Aug • 22:48</time><div><b>Correction requested</b><br><span>PSO Ko Zaw Min • Case DREG-260823-014 • reason: expired licence</span></div></div><div class="audit"><time>23 Aug • 22:41</time><div><b>Full licence image viewed</b><br><span>KYC reviewer Khin Lay • purpose: expiry verification</span></div></div><div class="audit"><time>23 Aug • 21:16</time><div><b>Staff invitation created</b><br><span>Staff registrar Mya Mya • MARKETER • Yangon Central</span></div></div><div class="audit"><time>23 Aug • 20:04</time><div><b>Session revoked</b><br><span>CTO • device 2C11 • anomalous location</span></div></div></div>`;
const fns=[dashboard,review,staff,roles,audit];function render(){document.getElementById('nav').innerHTML=pages.map((x,i)=>`<button class="${i===page?'active':''}" onclick="page=${i};render()">${['▦','🪪','👥','🔐','≡'][i]} &nbsp;${x}</button>`).join('');document.getElementById('main').innerHTML=fns[page]();}render();
</script></body></html>
