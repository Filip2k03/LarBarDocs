<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LarBar Guardian Safety Shield — Interactive Prototype</title>
  <style>
    :root {
      --bg: #0E0F14;
      --card: #181922;
      --card-elevated: #242533;
      --border: #282836;
      --gold-primary: #F59E0B;
      --red-primary: #E5252A;
      --emerald: #10B981;
      --text: #FFFFFF;
      --text-muted: #9CA3AF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pyidaungsu', sans-serif; }
    body { background: #07080B; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }
    
    .header-nav { text-align: center; margin-bottom: 24px; max-width: 600px; }
    .header-nav h1 { color: var(--emerald); font-size: 24px; margin-bottom: 8px; font-weight: 900; }
    .header-nav p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .tab-btn.active { background: var(--emerald); color: #181922; border-color: var(--emerald); font-weight: 800; }

    .phone-container {
      width: 390px;
      height: 844px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 44px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8), 0 0 0 8px #181922;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .island { width: 120px; height: 28px; background: #000; border-radius: 14px; margin: 10px auto 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; }
    .island-cam { width: 8px; height: 8px; border-radius: 50%; background: #181922; }
    .status-bar { display: flex; justify-content: space-between; padding: 4px 28px 8px; font-size: 12px; font-weight: 600; }
    .app-header { background: rgba(24, 25, 34, 0.95); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .app-header .logo { color: var(--emerald); font-size: 18px; font-weight: 900; }
    .app-header .title { font-size: 13px; font-weight: 700; }

    .content-viewport { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .home-indicator { width: 130px; height: 4px; background: #484856; border-radius: 2px; margin: 8px auto 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .btn-red { background: linear-gradient(135deg, #F85A5A, var(--red-primary)); color: #FFF; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 15px; width: 100%; cursor: pointer; text-align: center; }
    .btn-emerald { background: linear-gradient(135deg, #34D399, var(--emerald)); color: #181922; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 15px; width: 100%; cursor: pointer; text-align: center; }
  </style>
</head>
<body>

  <div class="header-nav">
    <h1>🛡️ LarBar Guardian Safety Shield Interactive Prototype</h1>
    <p>Simulate family guardian live 60fps ride telemetry, cross-track deviation warnings, driver shift health, and DND-override siren triggers.</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchStep(1)">1. Passenger Live Shield</button>
      <button class="tab-btn" onclick="switchStep(2)">2. Driver Family Shield</button>
      <button class="tab-btn" onclick="switchStep(3)">3. Family Mesh QR Pairing</button>
    </div>
  </div>

  <div class="phone-container">
    <div class="island"><div class="island-cam"></div></div>
    <div class="status-bar"><span>9:41</span><span>5G 🔋 94%</span></div>
    
    <div class="app-header">
      <span class="logo">Guardian</span>
      <span class="title" id="screen-title">မိသားစု အကာအကွယ်</span>
      <span>🔒</span>
    </div>

    <div class="content-viewport" id="viewport"></div>
    <div class="home-indicator"></div>
  </div>

  <script>
    const steps = [
      {
        title: 'မိသားစု အကာအကွယ် (Passenger Live Shield)',
        html: `
          <div class="card" style="border: 2px solid var(--emerald);">
            <div style="color: var(--emerald); font-weight: 800; font-size: 12px; margin-bottom: 4px;">🟢 RIDE IN PROGRESS (NORMAL)</div>
            <div style="font-weight: 800; font-size: 16px;">Passenger: Ma Thiri (Daughter)</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Driver: U Aung Kyaw (Toyota Fielder 3A-8492)</div>
          </div>

          <div style="height: 200px; background: #14151D; border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative;">
            <div style="color: var(--emerald); font-weight: 800; font-size: 13px;">📍 Live GPS Stream: 38 km/h on Pyay Road</div>
            <div style="position: absolute; bottom: 10px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 8px; font-size: 10px; color: var(--emerald);">
              Cross-Track Deviation: 12m (SAFE &lt; 300m)
            </div>
          </div>

          <button class="btn-red" onclick="alert('🚨 Remote High-Decibel Siren Triggered on Passenger Phone with DND Override!')">🚨 အရေးပေါ် ဥသြသံဖွင့်မည် (SOS SIREN)</button>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button style="background: var(--card); border: 1px solid var(--border); color: #FFF; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">📞 Call Driver</button>
            <button style="background: var(--card); border: 1px solid var(--border); color: #FFF; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">👮 Call Police 199</button>
          </div>
        `
      },
      {
        title: 'ယာဥ်မောင်း မိသားစု အကာအကွယ် (Driver Family Shield)',
        html: `
          <div class="card" style="border: 2px solid var(--emerald);">
            <div style="color: var(--emerald); font-weight: 800; font-size: 12px; margin-bottom: 4px;">🟢 DRIVER STATUS: ON-DUTY</div>
            <div style="font-weight: 800; font-size: 16px;">Ko Aung Kyaw (Husband)</div>
            <div style="font-size: 12px; color: #38BDF8; margin-top: 4px;">🔋 Phone Battery: 86% • 📶 5G Strong</div>
          </div>

          <div class="card">
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Current Shift Metrics:</div>
            <div style="font-size: 13px; font-weight: 700;">Active for: <span style="color: var(--gold-primary);">4 hours 20 mins</span></div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Last GPS Ping: 1s ago (Accuracy: 2.8m)</div>
          </div>

          <button class="btn-red" onclick="alert('🚨 Emergency Siren Broadcasted to Husband Taxi!')">🚨 အရေးပေါ် အချက်ပြသံ မြည်စေမည် (SOS)</button>
          <button class="btn-emerald" onclick="alert('Calling Ko Aung Kyaw...')">📞 ခင်ပွန်းထံ ဖုန်းတိုက်ရိုက်ခေါ်ဆိုမည်</button>
        `
      },
      {
        title: 'မိသားစု ချိတ်ဆက်ခြင်း (Family QR Pairing)',
        html: `
          <div class="card" style="text-align: center; padding: 24px 16px;">
            <div style="font-weight: 800; font-size: 15px; margin-bottom: 6px;">Scan Family Guardian QR</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 16px;">Sync live tracking in under 10 seconds</div>

            <div style="width: 140px; height: 140px; background: #FFF; margin: 0 auto 16px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 32px; font-weight: 900;">
              🛡️ QR
            </div>

            <div style="background: var(--card-elevated); border: 1px solid var(--gold-primary); padding: 10px; border-radius: 10px; font-size: 18px; font-weight: 900; letter-spacing: 4px; color: var(--gold-primary);">
              8 4 9 2 0 1
            </div>
            <div style="font-size: 10px; color: var(--text-muted); margin-top: 6px;">6-digit token valid for 10 mins</div>
          </div>

          <button class="btn-emerald" onclick="alert('✓ Invitation link copied to clipboard!')">မိသားစုထံ ဖိတ်ခေါ်လင့်ခ် ပေးပို့မည် (SHARE LINK)</button>
        `
      }
    ];

    function switchStep(stepNum) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', i === stepNum - 1);
      });
      const s = steps[stepNum - 1];
      document.getElementById('screen-title').innerText = s.title;
      document.getElementById('viewport').innerHTML = s.html;
    }

    switchStep(1);
  </script>
</body>
</html>
