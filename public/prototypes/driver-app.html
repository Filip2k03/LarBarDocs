<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LarBar Driver App — Live Map Interactive Prototype</title>
  
  <!-- Leaflet.js for Real Live Yangon Map Tiles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --clr-noir-base: #0A0B0E;
      --clr-noir-surface: #12131A;
      --clr-noir-elevated: #1C1D26;
      --clr-noir-card: #232532;
      --clr-noir-border: #2D3042;
      
      --clr-gold-300: #FFE082;
      --clr-gold-500: #F59E0B;
      --clr-gold-600: #D97706;
      --clr-crimson-500: #E5252A;
      --clr-crimson-600: #C41419;
      --clr-emerald-500: #10B981;
      --clr-cyan-500: #06B6D4;
      
      --clr-text-main: #FFFFFF;
      --clr-text-dim: #94A3B8;
      --clr-text-sub: #64748B;
      
      --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pyidaungsu', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-display); }
    body { background: var(--clr-noir-base); color: var(--clr-text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }

    /* Top Navigation */
    .prototype-control-hub { text-align: center; margin-bottom: 20px; max-width: 680px; }
    .prototype-heading { font-size: 26px; font-weight: 900; color: var(--clr-crimson-500); letter-spacing: -0.5px; margin-bottom: 6px; }
    .prototype-subtitle { font-size: 13px; color: var(--clr-text-dim); line-height: 1.5; margin-bottom: 16px; }
    
    .lifecycle-nav-pill-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .lifecycle-tab-trigger {
      background: var(--clr-noir-surface);
      border: 1px solid var(--clr-noir-border);
      color: var(--clr-text-dim);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lifecycle-tab-trigger:hover { border-color: var(--clr-crimson-500); color: var(--clr-text-main); }
    .lifecycle-tab-trigger.is-active {
      background: linear-gradient(135deg, #F85A5A, var(--clr-crimson-500));
      color: #FFFFFF;
      border-color: var(--clr-crimson-500);
      box-shadow: 0 4px 14px rgba(229, 37, 42, 0.35);
    }

    /* Device Chassis */
    .device-chassis {
      width: 390px;
      height: 844px;
      background: var(--clr-noir-surface);
      border: 2px solid var(--clr-noir-border);
      border-radius: 48px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 0 10px #181924;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .notch-island {
      width: 125px;
      height: 28px;
      background: #000000;
      border-radius: 14px;
      margin: 10px auto 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }
    .camera-lens-dot { width: 8px; height: 8px; border-radius: 50%; background: #1C1D26; }
    
    .status-telemetry-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 30px 4px;
      font-size: 12px;
      font-weight: 700;
      z-index: 1000;
      background: rgba(18, 19, 26, 0.9);
    }

    .top-app-bar {
      background: rgba(18, 19, 26, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--clr-noir-border);
      z-index: 1000;
    }
    .brand-emblem { font-size: 18px; font-weight: 900; color: var(--clr-gold-500); letter-spacing: 0.5px; }
    .screen-title-tag { font-size: 12px; font-weight: 700; color: var(--clr-text-main); }

    /* Leaflet Live Map Box */
    .live-map-viewport {
      width: 100%;
      height: 220px;
      border-bottom: 1px solid var(--clr-noir-border);
      position: relative;
      z-index: 10;
    }
    .leaflet-container { background: #12131A !important; }

    .interactive-scroll-pane { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; z-index: 20; background: var(--clr-noir-surface); }
    .interactive-scroll-pane::-webkit-scrollbar { width: 4px; }
    .interactive-scroll-pane::-webkit-scrollbar-thumb { background: var(--clr-noir-border); border-radius: 2px; }

    .bottom-home-indicator { width: 134px; height: 4px; background: var(--clr-text-sub); border-radius: 2px; margin: 6px auto 8px; z-index: 1000; }

    /* Component System */
    .route-timeline-container {
      background: var(--clr-noir-elevated);
      border: 1px solid var(--clr-noir-border);
      border-radius: 16px;
      padding: 14px;
    }

    .action-btn-gold {
      background: linear-gradient(135deg, var(--clr-gold-300), var(--clr-gold-500));
      color: #12131A;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 900;
      width: 100%;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 20px rgba(245,158,11,0.3);
      transition: transform 0.15s ease;
    }
    .action-btn-gold:hover { transform: translateY(-2px); }

    .action-btn-crimson {
      background: linear-gradient(135deg, #F85A5A, var(--clr-crimson-500));
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 900;
      width: 100%;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 20px rgba(229,37,42,0.35);
      transition: transform 0.15s ease;
    }
    .action-btn-crimson:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="prototype-control-hub">
    <h1 class="prototype-heading">🚗 LarBar Driver Live Map Prototype</h1>
    <p class="prototype-subtitle">Real-time turn-by-turn navigation across Yangon, 15-second cascading offer acceptance, in-car 1080p CCTV recording HUD, 1km fellow driver emergency SOS intercept radar, and sales payout.</p>
    
    <div class="lifecycle-nav-pill-group">
      <button class="lifecycle-tab-trigger is-active" onclick="renderStep(1)">1. Shift Dashboard</button>
      <button class="lifecycle-tab-trigger" onclick="renderStep(2)">2. 15s Incoming Offer</button>
      <button class="lifecycle-tab-trigger" onclick="renderStep(3)">3. Turn Meter &amp; CCTV</button>
      <button class="lifecycle-tab-trigger" onclick="renderStep(4)">4. 1km SOS Mesh Radar</button>
      <button class="lifecycle-tab-trigger" onclick="renderStep(5)">5. Daily Sales Payout</button>
    </div>
  </div>

  <div class="device-chassis">
    <div class="notch-island"><div class="camera-lens-dot"></div></div>
    <div class="status-telemetry-bar">
      <span>9:41</span>
      <span>5G 🔋 88%</span>
    </div>

    <div class="top-app-bar">
      <span class="brand-emblem">LarBar</span>
      <span class="screen-title-tag" id="active-screen-title">ယာဥ်မောင်း ပင်မစာမျက်နှာ</span>
      <div style="font-size: 12px;">🔔</div>
    </div>

    <!-- Leaflet Map Canvas -->
    <div id="driver-map" class="live-map-viewport"></div>

    <div class="interactive-scroll-pane" id="interactive-viewport"></div>

    <div class="bottom-home-indicator"></div>
  </div>

  <script>
    let dmap = null;
    let droute = null;
    let victimCircle = null;

    const driverCoords = {
      sule: [16.7794, 96.1554],
      junction: [16.7820, 96.1495],
      victim: [16.7804, 96.1530],
      driverPos: [16.7790, 96.1560]
    };

    function initDriverMap() {
      if (dmap) return;
      dmap = L.map('driver-map', {
        center: driverCoords.sule,
        zoom: 15,
        zoomControl: false,
        attributionControl: false
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(dmap);

      // Driver position pin
      L.marker(driverCoords.driverPos, {
        icon: L.divIcon({
          className: 'custom-driver-pin',
          html: '<div style="background:#F59E0B; color:#12131A; font-weight:900; font-size:10px; padding:3px 6px; border-radius:6px; border:2px solid #FFF; white-space:nowrap;">🚖 You (38 km/h)</div>',
          iconSize: [84, 24]
        })
      }).addTo(dmap);
    }

    function renderStep(step) {
      document.querySelectorAll('.lifecycle-tab-trigger').forEach((btn, idx) => {
        btn.classList.toggle('is-active', idx === step - 1);
      });

      const viewport = document.getElementById('interactive-viewport');
      const titleEl = document.getElementById('active-screen-title');

      if (!dmap) {
        setTimeout(initDriverMap, 200);
      }

      if (victimCircle && dmap) {
        dmap.removeLayer(victimCircle);
        victimCircle = null;
      }

      if (step === 1) {
        titleEl.innerText = 'ယာဥ်မောင်း ပင်မစာမျက်နှာ (Shift Dashboard)';
        viewport.innerHTML = `
          <div class="route-timeline-container" style="border: 2px solid var(--clr-emerald-500); display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-weight: 800; font-size: 14px;">အလုပ်ဆင်းနေသည် (ON DUTY)</div>
              <div style="font-size: 11px; color: var(--clr-emerald-500);">Online • 15s Cascading Offers Active</div>
            </div>
            <div style="width: 44px; height: 24px; background: var(--clr-emerald-500); border-radius: 12px; display: flex; align-items: center; justify-content: flex-end; padding-right: 2px;">
              <div style="width: 18px; height: 18px; border-radius: 50%; background: #FFF;"></div>
            </div>
          </div>

          <div class="route-timeline-container">
            <div style="font-size: 11px; color: var(--clr-text-dim);">ယနေ့ ရရှိငွေ (Today's Earnings)</div>
            <div style="color: var(--clr-gold-500); font-size: 28px; font-weight: 900; margin: 2px 0;">48,500 MMK</div>
            <div style="font-size: 11px; color: #FFF;">12 Completed Trips • 5.4h Online • ⭐ 4.96</div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="route-timeline-container" onclick="renderStep(5)" style="cursor: pointer; text-align: center; padding: 10px;">
              <div style="font-size: 18px;">💳</div>
              <div style="font-weight: 700; font-size: 12px;">ငွေထုတ်ယူမည်</div>
              <div style="font-size: 10px; color: var(--clr-text-dim);">KBZPay Transfer</div>
            </div>
            <div class="route-timeline-container" style="text-align: center; padding: 10px;">
              <div style="font-size: 18px;">📹</div>
              <div style="font-weight: 700; font-size: 12px;">CCTV Active</div>
              <div style="font-size: 10px; color: var(--clr-emerald-500);">1080p Stream</div>
            </div>
          </div>

          <button class="action-btn-crimson" onclick="renderStep(4)">🚨 အရေးပေါ် အကူအညီတောင်းရန် (SOS)</button>
          <button class="action-btn-gold" onclick="renderStep(2)">Simulate Incoming 15s Ride Offer ➔</button>
        `;
      } else if (step === 2) {
        titleEl.innerText = 'ခရီးစဥ်အသစ် ရောက်ရှိပါသည် (15s Offer)';
        viewport.innerHTML = `
          <div class="route-timeline-container" style="border: 2px solid var(--clr-gold-500); text-align: center;">
            <div style="background: var(--clr-gold-500); color: #12131A; font-weight: 900; font-size: 12px; padding: 6px; border-radius: 8px; margin-bottom: 10px;">
              ⏱️ 15s Cascading Offer (11s left)
            </div>
            <div style="color: var(--clr-gold-500); font-size: 30px; font-weight: 900;">3,800 MMK</div>
            <div style="font-size: 11px; color: var(--clr-cyan-500); margin-bottom: 12px;">Cashless (KBZPay Direct) • Standard Taxi</div>
            
            <div style="text-align: left; background: var(--clr-noir-card); padding: 10px; border-radius: 10px; font-size: 11px; margin-bottom: 12px;">
              <div style="margin-bottom: 4px;"><b style="color: var(--clr-emerald-500);">Pickup:</b> Sule Square (450m away)</div>
              <div><b style="color: var(--clr-crimson-500);">Dest:</b> Junction City Mall (5.4 km)</div>
            </div>

            <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px; text-align: left;">
              <div style="font-size: 20px;">👤</div>
              <div>
                <div style="font-weight: 700; font-size: 12px;">Ma Thiri (Passenger)</div>
                <div style="font-size: 10px; color: var(--clr-gold-500);">⭐ 4.95 (148 trips completed)</div>
              </div>
            </div>

            <button class="action-btn-gold" style="margin-bottom: 6px;" onclick="renderStep(3)">လက်ခံမည် (ACCEPT RIDE OFFER)</button>
            <button style="background: transparent; border: 1px solid var(--clr-crimson-500); color: var(--clr-crimson-500); padding: 8px; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; font-size: 12px;" onclick="renderStep(1)">ငြင်းပယ်မည် (Decline)</button>
          </div>
        `;
      } else if (step === 3) {
        titleEl.innerText = 'လမ်းညွှန် မီတာစနစ် (Turn Navigation & CCTV)';
        viewport.innerHTML = `
          <div style="background: var(--clr-crimson-500); padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-align: center; margin-bottom: 4px;">
            ● REC 1080p CCTV PROTECTING BUFFER ACTIVE
          </div>

          <div class="route-timeline-container" style="border: 2px solid var(--clr-gold-500);">
            <div style="font-size: 11px; color: var(--clr-text-dim);">Dynamic Taximeter HUD</div>
            <div style="color: var(--clr-gold-500); font-size: 28px; font-weight: 900; margin: 2px 0;">3,850 MMK</div>
            <div style="font-size: 11px; color: #FFF;">5.4 km • 14m 20s • Speed: 38 km/h</div>
          </div>

          <div class="route-timeline-container">
            <div style="font-weight: 700; font-size: 12px; margin-bottom: 2px;">Turn Left on Bogyoke Aung San Rd (220m)</div>
            <div style="font-size: 11px; color: var(--clr-text-dim);">Destination: Junction City Mall, Main Entrance</div>
          </div>

          <button class="action-btn-gold" onclick="renderStep(5)">ရောက်ရှိပါပြီ (ARRIVED &amp; COLLECT)</button>
        `;
      } else if (step === 4) {
        titleEl.innerText = '၁ကီလိုမီတာ အရေးပေါ် အကူအညီ (SOS Mesh)';
        
        // Add victim circle on map
        if (dmap) {
          victimCircle = L.circle(driverCoords.victim, {
            color: '#E5252A',
            fillColor: '#E5252A',
            fillOpacity: 0.4,
            radius: 200
          }).addTo(dmap);
          dmap.setView(driverCoords.victim, 16);
        }

        viewport.innerHTML = `
          <div class="route-timeline-container" style="border: 2px solid var(--clr-crimson-500); background: #2A0E10; text-align: center;">
            <div style="font-size: 28px; margin-bottom: 4px;">🚨</div>
            <div style="color: #FFF; font-size: 16px; font-weight: 900;">CODE RED: DRIVER IN DISTRESS</div>
            <div style="color: var(--clr-gold-500); font-size: 12px; margin: 4px 0;">U Kyaw Swar (240m away • White Probox 4B-9102)</div>
            <div style="font-size: 11px; color: #FFE8E8;">Physical Passenger Attack Reported</div>
          </div>

          <div class="route-timeline-container">
            <div style="font-size: 11px; color: var(--clr-text-dim); margin-bottom: 4px;">Incident Location:</div>
            <div style="font-weight: 700; font-size: 12px;">Corner of Anawrahta &amp; Sule Pagoda Rd</div>
            <div style="font-size: 11px; color: var(--clr-emerald-500); margin-top: 4px;">Protecting CCTV Video Buffer Locked</div>
          </div>

          <button class="action-btn-crimson" style="margin-bottom: 6px;" onclick="alert('⚡ Response confirmed! Navigation vector plotted to victim driver.')">ကူညီရန် သွားမည် (I AM RESPONDING / EN ROUTE)</button>
          <button class="action-btn-gold" onclick="renderStep(1)">Back to Dashboard</button>
        `;
      } else if (step === 5) {
        titleEl.innerText = 'ဝင်ငွေ ထုတ်ယူခြင်း (Sales Payout)';
        viewport.innerHTML = `
          <div class="route-timeline-container" style="border: 2px solid var(--clr-gold-500);">
            <div style="font-size: 11px; color: var(--clr-text-dim);">ထုတ်ယူနိုင်သော လက်ကျန်ငွေ (Net Balance)</div>
            <div style="color: var(--clr-gold-500); font-size: 30px; font-weight: 900; margin: 2px 0;">41,225 MMK</div>
            <div style="font-size: 11px; color: var(--clr-emerald-500);">Net after 15% platform commission (-7,275 MMK)</div>
          </div>

          <div class="route-timeline-container">
            <div style="font-weight: 700; font-size: 12px; margin-bottom: 8px;">Transfer to Linked E-Wallet:</div>
            <div style="background: var(--clr-noir-card); border: 1px solid var(--clr-cyan-500); padding: 8px; border-radius: 8px;">
              <div style="color: var(--clr-cyan-500); font-weight: 800; font-size: 12px;">KBZPay Partner Direct</div>
              <div style="font-size: 10px; color: var(--clr-text-dim);">09123456789 (U Aung Kyaw)</div>
            </div>
          </div>

          <button class="action-btn-gold" onclick="alert('✓ 41,225 MMK transferred instantly to KBZPay!')">ငွေထုတ်ယူမှု အတည်ပြုမည် (TRANSFER NOW)</button>
          <button style="background: transparent; border: 1px solid var(--clr-noir-border); color: #FFF; padding: 10px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 12px;" onclick="renderStep(1)">Back to Dashboard</button>
        `;
      }
    }

    renderStep(1);
  </script>
</body>
</html>
