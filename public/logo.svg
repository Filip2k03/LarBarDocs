<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F85A5A" />
      <stop offset="100%" stop-color="#C41419" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <polygon points="100,10 180,45 180,125 100,190 20,125 20,45" fill="#181922" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner Red Accent Shield -->
  <polygon points="100,25 165,55 165,118 100,172 35,118 35,55" fill="url(#redGrad)" opacity="0.95"/>

  <!-- Taxi Top Light Symbol -->
  <rect x="75" y="55" width="50" height="18" rx="4" fill="url(#goldGrad)" />
  <text x="100" y="68" font-family="Inter, sans-serif" font-size="10" font-weight="900" fill="#181922" text-anchor="middle">TAXI</text>

  <!-- Stylized Car Silhouette / Shield Emblem -->
  <path d="M 60 115 L 72 82 L 128 82 L 140 115 Z" fill="#FFFFFF" opacity="0.9"/>
  <rect x="52" y="115" width="96" height="24" rx="6" fill="#181922" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Headlights -->
  <circle cx="65" cy="127" r="5" fill="url(#goldGrad)"/>
  <circle cx="135" cy="127" r="5" fill="url(#goldGrad)"/>

  <!-- Star Safety Emblem -->
  <polygon points="100,90 103,98 111,98 105,103 107,111 100,106 93,111 95,103 89,98 97,98" fill="url(#goldGrad)"/>
</svg>
