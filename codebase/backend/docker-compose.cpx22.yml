# Single-node staging profile for a Hetzner CPX22-class server.
# Production should use a secret manager and separate data services.

services:
  caddy_edge:
    image: caddy:2-alpine
    container_name: labar_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 150M

  go_api_core:
    build:
      context: .
      dockerfile: Dockerfile
    image: labar/backend-api:latest
    container_name: labar_go_core
    restart: unless-stopped
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_DSN=postgres://labar_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres_db:5432/labar_prod?sslmode=disable
      - REDIS_ADDR=redis_spatial:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_spatial:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/labar-api", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 400M

  postgres_db:
    image: postgis/postgis:16-3.4-alpine
    container_name: labar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labar_prod
      POSTGRES_USER: labar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2048MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labar_user -d labar_prod"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1400M

  redis_spatial:
    image: redis:7-alpine
    container_name: labar_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass $${REDIS_PASSWORD}
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 450M

  osrm_myanmar:
    image: osrm/osrm-backend:latest
    container_name: labar_osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-matching-size", "1000", "/data/myanmar-latest.osrm"]
    volumes:
      - ./osrm-data:/data:ro
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.70'
          memory: 1200M

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:

networks:
  labar_net:
    driver: bridge
