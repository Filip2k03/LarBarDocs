# Single-node staging profile for a Hetzner CPX22-class server.
# Production should use a secret manager and separate data services.

services:
  caddy_edge:
    image: caddy:2-alpine
    container_name: labar_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 150M

  go_api_core:
    build:
      context: .
      dockerfile: Dockerfile
    image: labar/backend-api:latest
    container_name: labar_go_core
    restart: unless-stopped
    environment: &backend_environment
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://labar_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres_db:5432/labar_prod?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis_spatial:6379/0
      PUBLIC_WEB_ORIGINS: ${PUBLIC_WEB_ORIGINS:?set PUBLIC_WEB_ORIGINS}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      OTP_SECRET: ${OTP_SECRET:?set OTP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      SMS_PROVIDER: http
      SMS_ENDPOINT: ${SMS_ENDPOINT:?set SMS_ENDPOINT}
      SMS_API_KEY: ${SMS_API_KEY:?set SMS_API_KEY}
      SMS_SENDER: ${SMS_SENDER:-LaBar}
      DEVELOPMENT_OTP_ENABLED: "false"
      MAP_PROVIDER: osrm
      MAP_BASE_URL: http://osrm_myanmar:5000
      GEOCODE_BASE_URL: ${GEOCODE_BASE_URL:-https://nominatim.openstreetmap.org}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-labar}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      STORAGE_USE_TLS: ${STORAGE_USE_TLS:-true}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      PAYMENT_ENDPOINT: ${PAYMENT_ENDPOINT:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_spatial:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 400M

  go_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: labar/backend-api:latest
    container_name: labar_go_worker
    restart: unless-stopped
    entrypoint: ["/app/worker"]
    environment: *backend_environment
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_spatial:
        condition: service_healthy
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 250M

  postgres_db:
    image: postgis/postgis:16-3.4-alpine
    container_name: labar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labar_prod
      POSTGRES_USER: labar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=768MB
      -c effective_cache_size=2048MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labar_user -d labar_prod"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 1400M

  redis_spatial:
    image: redis:7-alpine
    container_name: labar_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass $${REDIS_PASSWORD}
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 450M

  osrm_myanmar:
    image: osrm/osrm-backend:latest
    container_name: labar_osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-matching-size", "1000", "/data/myanmar-latest.osrm"]
    volumes:
      - ./osrm-data:/data:ro
    networks:
      - labar_net
    deploy:
      resources:
        limits:
          cpus: '0.70'
          memory: 1200M

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:

networks:
  labar_net:
    driver: bridge
